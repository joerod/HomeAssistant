- switch:
    - name: Living Room Movie Time
      unique_id: living_room_movie_time_switch
      state: >-
        {{ is_state('media_player.living_room_tv', 'on')
           and state_attr('media_player.living_room_tv', 'sound_output') == 'tv_external_speaker' }}
      turn_on:
        - service: script.living_room_movie_time
      turn_off:
        - service: script.living_room_movie_time_off
