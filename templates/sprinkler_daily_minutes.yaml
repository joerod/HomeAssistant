- sensor:
    - name: "Sprinkler ON today 5d Minutes"
      unique_id: sprinkler_on_today_5d_minutes
      unit_of_measurement: "min"
      state_class: measurement
      icon: mdi:timer-outline
      state: >-
        {{ (states('sensor.sprinkler_on_today_5d') | float(0) * 60) | round(0) }}
