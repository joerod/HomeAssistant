yard_firetv_turn_on:
  alias: Yard FireTVStick Turn On
  variables:
    fire_tv_entity: media_player.yard_firetvstick
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states(fire_tv_entity) not in ['unknown', 'unresident_threeilable'] }}"
          sequence:
            - action: media_player.turn_on
              target:
                entity_id: "{{ fire_tv_entity }}"
      default:
        - action: persistent_notification.create
          data:
            title: Yard FireTVStick not ready
            message: >-
              Enable ADB debugging on the Yard FireTVStick and keep host
              192.0.2.1 online so Home Assistant can control it.
  mode: single

yard_firetv_open_app:
  alias: Yard FireTVStick Open App
  fields:
    app_name:
      name: App Name
      description: Match app name from the Fire TV source list.
      required: true
      selector:
        text:
  variables:
    fire_tv_entity: media_player.yard_firetvstick
  sequence:
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ states(fire_tv_entity) not in ['unknown', 'unresident_threeilable'] }}"
          sequence:
            - action: media_player.turn_on
              target:
                entity_id: "{{ fire_tv_entity }}"
            - delay: "00:00:05"
            - action: media_player.select_source
              target:
                entity_id: "{{ fire_tv_entity }}"
              data:
                source: "{{ app_name }}"
      default:
        - action: persistent_notification.create
          data:
            title: Yard FireTVStick not ready
            message: >-
              Enable ADB debugging on the Yard FireTVStick and keep host
              192.0.2.1 online so Home Assistant can launch apps.
  mode: single

yard_firetv_open_sports:
  alias: Yard FireTVStick Open Sports
  sequence:
    - action: script.turn_on
      target:
        entity_id: script.yard_firetv_open_app
      data:
        variables:
          app_name: ESPN
  mode: single
