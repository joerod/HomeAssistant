meeting_lights:
  alias: Meeting Lights
  sequence:
    - action: automation.turn_off
      target:
        entity_id: automation.office_lights_on_basement_color
      data:
        stop_actions: false
    - service: hue.hue_activate_scene
      data:
        group_name: Office
        scene_name: Work video call
    - delay: "00:00:03"
    - action: automation.turn_on
      target:
        entity_id: automation.office_lights_on_basement_color
  mode: single
