low_battery_rosey:
  name: Rosey Battery Low
  done_message: Rosey's battery is above 10%
  entity_id: sensor.rosey_battery
  state: 'on'
  repeat: 60
  can_acknowledge: true
  skip_first: false
  message: "Rosey battery is low: {{ states('sensor.rosey_battery') }}%"
  notifiers:
    - notify.notify

