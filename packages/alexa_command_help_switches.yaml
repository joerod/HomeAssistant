template:
  - switch:
      - name: House Guide
        unique_id: alexa_command_help_all
        icon: mdi:comment-question
        state: "{{ false }}"
        turn_on:
          - action: script.alexa_command_help
            data:
              room: all
        turn_off: []

      - name: Living Room Guide
        unique_id: alexa_command_help_living_room
        icon: mdi:sofa
        state: "{{ false }}"
        turn_on:
          - action: script.alexa_command_help
            data:
              room: living room
        turn_off: []

      - name: Main Bedroom Guide
        unique_id: alexa_command_help_main_bedroom
        icon: mdi:bed-king
        state: "{{ false }}"
        turn_on:
          - action: script.alexa_command_help
            data:
              room: main bedroom
        turn_off: []

      - name: Kitchen Guide
        unique_id: alexa_command_help_kitchen
        icon: mdi:countertop
        state: "{{ false }}"
        turn_on:
