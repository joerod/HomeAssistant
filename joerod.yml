                name: Battery
              - entity: sensor.tessy_estimate_battery_range
                name: Estimated Range
              - entity: sensor.tessy_inside_temperature
                name: Inside Temp
              - entity: sensor.tessy_outside_temperature
                name: Outside Temp
              - entity: cover.tessy_windows
                name: Windows
              - entity: cover.tessy_trunk
                name: Trunk
              - entity: cover.tessy_frunk
                name: Frunk
              - entity: cover.tessy_charge_port_door
                name: Charge Port
          - type: picture
            image: /local/tesla-car-image.jpeg
          - type: map
            entities:
              - device_tracker.tessy_location
            hours_to_show: 24
            default_zoom: 15
          - type: gauge
            name: Battery
            entity: sensor.tessy_battery_level
            min: 0
            max: 100
            severity:
              green: 70
              yellow: 25
              red: 0
          - type: grid
            title: Controls
            columns: 2
            square: false
            cards:
              - type: button
                entity: climate.tessy_climate
                name: Climate
                icon: mdi:car-climate
                show_state: true
                tap_action:
                  action: more-info
              - type: button
                entity: switch.tessy_charge
                name: Charging
                icon: mdi:ev-station
                show_state: true
                tap_action:
                  action: toggle
              - type: button
                entity: lock.tessy_lock
                name: Car Lock
                icon: mdi:car-door-lock
                show_state: true
                tap_action:
                  action: more-info
              - type: button
                entity: button.tessy_flash_lights
                name: Find Car
                icon: mdi:car-search
                show_state: true
                tap_action:
                  action: call-service
                  service: button.press
                  target:
                    entity_id: button.tessy_flash_lights
              - type: button
                entity: select.tessy_seat_heater_front_left
                name: Driver Seat Heat
                icon: mdi:car-seat-heater
                show_state: true
                tap_action:
                  action: call-service
                  service: select.select_next
                  target:
                    entity_id: select.tessy_seat_heater_front_left
                  data:
                    cycle: true
                hold_action:
                  action: call-service
                  service: select.select_option
                  target:
                    entity_id: select.tessy_seat_heater_front_left
                  data:
                    option: "off"
              - type: button
                entity: select.tessy_seat_heater_front_right
                name: Passenger Seat Heat
                icon: mdi:car-seat-heater
                show_state: true
                tap_action:
                  action: call-service
                  service: select.select_next
                  target:
                    entity_id: select.tessy_seat_heater_front_right
                  data:
                    cycle: true
                hold_action:
                  action: call-service
                  service: select.select_option
                  target:
                    entity_id: select.tessy_seat_heater_front_right
                  data:
                    option: "off"
              - type: button
                entity: select.tessy_steering_wheel_heater
                name: Steering Heat
                icon: mdi:steering
                show_state: true
                tap_action:
                  action: call-service
                  service: select.select_next
                  target:
                    entity_id: select.tessy_steering_wheel_heater
                  data:
                    cycle: true
                hold_action:
                  action: call-service
                  service: select.select_option
                  target:
                    entity_id: select.tessy_steering_wheel_heater
                  data:
                    option: "off"
