  - title: Automations
    path: automations
    icon: mdi:robot
    badges: []
    cards:
      - type: custom:auto-entities
        card:
          type: entities
          title: Automations (Enabled)
          show_header_toggle: false
          state_color: true
          icon: mdi:home-automation
        filter:
          include:
            - domain: automation
              state: "on"
          exclude: []
        sort:
          method: name
      - type: custom:auto-entities
        card:
          type: entities
          title: Automations (Disabled)
          show_header_toggle: false
          state_color: true
          icon: mdi:home-automation
        filter:
          include:
            - domain: automation
              state: "off"
          exclude: []
        sort:
          method: name
