title: Rodriguez Home
views:
  - icon: mdi:home-assistant
    panel: false
    path: default_view
    theme: default
    title: Home
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.openweathermap_feels_like_temperature
        name: Feels Like Outside
      - type: entity
        entity: sun.sun
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.waqi_maspeth_new_york_usa_2
        name: Air Quality
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.basement_temperature
        name: Basement
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.living_room_temperature
        name: Living Room
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.upstairs_temperature
        name: 2nd Floor
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.main_bedroom_inside_temperature
        name: Main Bedroom
      - type: entity
        entity: sensor.exchange_rate_1_btc
        name: Bitcoin Price
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: binary_sensor.basement_door_contact
        name: Basement Door
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: switch.virtual_sprinkler
        icon: mdi:water
        name: Sprinkler
    cards:
      - type: custom:stack-in-card
        title: Cameras
        mode: vertical
        keep:
          background: true
          outer_padding: true
          margin: true
          box_shadow: true
          border_radius: true
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: picture-entity
                entity: camera.front_door
                camera_image: camera.front_door
                fit_mode: cover
                aspect_ratio: 75%
                show_state: false
                show_name: false
              - type: picture-entity
                entity: camera.backyard
                fit_mode: cover
                aspect_ratio: 75%
                show_state: false
                show_name: false
              - type: picture-entity
                entity: camera.driveway
                fit_mode: cover
                aspect_ratio: 75%
                show_state: false
                show_name: false
      - type: weather-forecast
        entity: weather.home
        name: 5-Day Forecast
        show_current: true
        show_forecast: true
        forecast_type: daily
      - type: vertical-stack
        title: Split units
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Main
            icon: mdi:home-floor-1
          - type: custom:bubble-card
            card_type: climate
            entity: climate.kitchen
            name: Kitchen
            icon: mdi:silverware-fork-knife
            sub_buttons:
              - entity: climate.kitchen
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.kitchen
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
          - type: custom:bubble-card
            card_type: climate
            entity: climate.living_room
            name: Living Room
            icon: mdi:sofa
            sub_buttons:
              - entity: climate.living_room
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.living_room
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
              - entity: climate.living_room
                attribute: fan_mode
                name: Fan
                icon: mdi:fan
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
          - type: custom:bubble-card
            card_type: separator
            name: 2nd Floor
            icon: mdi:home-floor-2
          - type: custom:bubble-card
            card_type: climate
            entity: climate.ava_room
            name: Ava
            icon: mdi:bed-king-outline
            sub_buttons:
              - entity: climate.ava_room
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.ava_room
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
              - entity: climate.ava_room
                attribute: fan_mode
                name: Fan
                icon: mdi:fan
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
          - type: custom:bubble-card
            card_type: climate
            entity: climate.aly
            name: Aly
            icon: mdi:bed-king-outline
            sub_buttons:
              - entity: climate.aly
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.aly
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
              - entity: climate.aly
                attribute: fan_mode
                name: Fan
                icon: mdi:fan
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
          - type: custom:bubble-card
            card_type: climate
            entity: climate.arabella
            name: Arabella
            icon: mdi:bed-king-outline
            sub_buttons:
              - entity: climate.arabella
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.arabella
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
              - entity: climate.arabella
                attribute: fan_mode
                name: Fan
                icon: mdi:fan
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
          - type: custom:bubble-card
            card_type: separator
            name: 3rd Floor
            icon: mdi:home-floor-3
          - type: custom:bubble-card
            card_type: climate
            entity: climate.main_bedroom
            name: Main Bedroom
            icon: mdi:bed-king-outline
            sub_buttons:
              - entity: climate.main_bedroom
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: climate.main_bedroom
                attribute: hvac_action
                name: HVAC
                icon: mdi:hvac
            sub_button:
              main:
                - name: HVAC modes menu
                  select_attribute: hvac_modes
                  state_background: false
                  show_arrow: false
                  sub_button_type: select
              bottom: []
            show_state: true
            show_attribute: true
      - type: entities
        title: Fans
        show_header_toggle: false
        entities:
          - entity: fan.main_bedroom_fan
            icon: mdi:fan
            type: custom:bubble-card
            card_type: button
            button_type: slider
            show_attribute: false
            show_state: true
          - type: conditional
            conditions:
              - entity: fan.office
                state_not: unavailable
              - entity: fan.office
                state_not: unknown
            row:
              entity: fan.office
              name: Office Fan
              type: custom:bubble-card
              card_type: button
              button_type: slider
              show_state: true
      - type: vertical-stack
        title: Heat
        cards:
          - type: custom:bubble-card
            card_type: climate
            entity: climate.basement
            name: Basement
            icon: mdi:home-floor-b
            sub_buttons:
              - entity: climate.basement
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
            sub_button:
              - name: HVAC modes menu
                select_attribute: hvac_modes
                state_background: false
                show_arrow: false
            show_state: false
            show_attribute: true
            attribute: temperature
          - type: custom:bubble-card
            card_type: climate
            entity: climate.living_room_2
            name: Main Floor
            icon: mdi:home-floor-1
            sub_buttons:
              - entity: climate.living_room_2
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
            sub_button:
              - name: HVAC modes menu
                select_attribute: hvac_modes
                state_background: false
                show_arrow: false
            show_state: false
            show_attribute: true
            attribute: temperature
          - type: custom:bubble-card
            card_type: climate
            entity: climate.upstairs
            name: Upstairs
            icon: mdi:home-floor-2
            sub_buttons:
              - entity: climate.upstairs
                attribute: current_temperature
                name: Temp
                icon: mdi:thermometer
              - entity: sensor.upstairs_humidity
                name: Humidity
                icon: mdi:water-percent
            sub_button:
              - name: HVAC modes menu
                select_attribute: hvac_modes
                state_background: false
                show_arrow: false
            show_state: false
            show_attribute: true
            attribute: temperature
      - type: entities
        title: Locks
        show_header_toggle: false
        entities:
          - entity: lock.side_door
            type: custom:bubble-card
            card_type: button
            button_type: switch
            icon: mdi:home-lock
            show_state: true
      - type: grid
        title: Quick Scripts
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            entity: input_boolean.tv_sound_mode_music
            show_state: false
            name: |
              [[[
                return states['input_boolean.tv_sound_mode_music']?.state === 'on'
                  ? 'Music'
                  : 'Sports';
              ]]]
            icon: |
              [[[
                return states['input_boolean.tv_sound_mode_music']?.state === 'on'
                  ? 'mdi:music'
                  : 'mdi:basketball';
              ]]]
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.toggle_tv_sound_mode
            hold_action:
              action: more-info
            styles:
              card:
                - padding: 10px
                - border-radius: 12px
              name:
                - font-size: 14px
                - font-weight: "600"
              icon:
                - width: 24px
                - color: var(--primary-color)
          - type: custom:button-card
            entity: script.tv_surround_mute
            name: Mute
            icon: mdi:volume-mute
            show_state: false
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.tv_surround_mute
            hold_action:
              action: more-info
            styles:
              card:
                - padding: 10px
                - border-radius: 12px
              name:
                - font-size: 14px
                - font-weight: "600"
              icon:
                - width: 24px
                - color: var(--primary-color)
          - type: custom:button-card
            entity: script.vacuum_then_mop
            name: Vacuum/Mop
            icon: mdi:robot-vacuum-variant
            show_state: false
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.vacuum_then_mop
            hold_action:
              action: more-info
            styles:
              card:
                - padding: 10px
                - border-radius: 12px
              name:
                - font-size: 14px
                - font-weight: "600"
              icon:
                - width: 24px
                - color: var(--primary-color)
          - type: custom:button-card
            entity: script.christmas_morning_on
            name: Christmas
            icon: mdi:pine-tree
            show_state: false
            hidden: |
              [[[
                return new Date().getMonth() !== 11;
              ]]]
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.christmas_morning_on
            hold_action:
              action: more-info
            styles:
              card:
                - padding: 10px
                - border-radius: 12px
              name:
                - font-size: 14px
                - font-weight: "600"
              icon:
                - width: 24px
                - color: var(--primary-color)
      - type: grid
        title: Lights On
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.font_door_lights
            name: Front Door Lights
            icon: mdi:outdoor-lamp
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: switch.font_door_lights
                state: "on"
          - type: custom:mushroom-entity-card
            entity: switch.side_door_light
            name: Side Door Light
            icon: mdi:outdoor-lamp
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: switch.side_door_light
                state: "on"
          - type: custom:mushroom-light-card
            entity: light.garden
            name: Garden Lights
            icon: mdi:flower
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.garden
                state: "on"
          - type: custom:mushroom-light-card
            entity: group.side_entrance_lights
            name: Side Entrance
            icon: mdi:wall-sconce-flat
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.side_entrance_light
                state: "on"
          - type: conditional
            conditions:
              - entity: light.vestibule
                state: "on"
            card:
              type: custom:mushroom-light-card
              entity: light.vestibule
              name: Vestibule
              icon: mdi:wall-sconce-flat
              show_brightness_control: true
              use_light_color: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              fill_container: true
          - type: custom:mushroom-light-card
            entity: light.kitchen_light
            name: Kitchen
            icon: mdi:ceiling-light
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.kitchen_light
                state: "on"
          - type: custom:mushroom-light-card
            entity: light.dinning_room
            name: Dining Room
            icon: mdi:ceiling-light
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.dinning_room
                state: "on"
          - type: custom:mushroom-light-card
            entity: light.office
            name: Office
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.office
                state: "on"
          - type: custom:mushroom-light-card
            entity: light.office_desk_lightstrip
            name: Office Desk Lightstrip
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.office_desk_lightstrip
                state: "on"
          - type: custom:mushroom-entity-card
            entity: switch.yard_lights
            name: Yard Lights
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: switch.yard_lights
                state: "on"
          - type: custom:mushroom-light-card
            entity: group.main_bedroom_lamps
            name: Main Bedroom Lamps
            icon: mdi:desk-lamp
            show_brightness_control: true
            show_color_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: group.main_bedroom_lamps
                state: "on"
          - type: custom:mushroom-light-card
            entity: light.living_room_table_lamp
            name: Living Room Table Lamp
            icon: mdi:lamp
            show_brightness_control: true
            use_light_color: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            fill_container: true
            visibility:
              - condition: state
                entity: light.living_room_table_lamp
                state: "on"
          - type: conditional
            conditions:
              - entity: binary_sensor.twinkly_light_exists
                state: "on"
            card:
              type: custom:mushroom-light-card
              entity: light.twinkly_37bdd1
              name: Christmas Tree
              icon: mdi:pine-tree
              show_brightness_control: true
              use_light_color: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              fill_container: true
              visibility:
                - condition: state
                  entity: light.twinkly_37bdd1
                  state: "on"
      - type: entities
        title: Robot Cleaners
        show_header_toggle: false
        entities:
          - type: custom:vacuum-card
            entity: vacuum.rosey
            battery_entity: sensor.rosey_battery
          - type: custom:vacuum-card
            entity: vacuum.agnes
            battery_entity: sensor.agnes_battery_level
          - entity: vacuum.henry_orbit
            name: Mac
          - entity: sensor.mac_water_tank_level
            name: Mac Water Tank
            icon: mdi:water-percent
          - entity: sensor.henry_orbit_battery
            name: Mac Battery
            icon: mdi:battery-high
      - type: vertical-stack
        title: Blinds & Skylight
        cards:
          - type: custom:mushroom-cover-card
            entity: cover.skylight_1
            name: Skylight
            show_position_control: true
            show_buttons_control: true
            fill_container: false
            layout: horizontal
          - type: custom:mushroom-cover-card
            entity: cover.blind_1
            name: Skylight Blind
            show_position_control: true
            show_buttons_control: true
            fill_container: false
            layout: horizontal
          - type: custom:mushroom-cover-card
            entity: cover.kitchen_blind_trimmed
            name: Kitchen Blind
            show_position_control: true
            show_buttons_control: true
            fill_container: false
            layout: horizontal
      - type: custom:stack-in-card
        title: Garden Sprinkler
        mode: vertical
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: switch.virtual_sprinkler
                name: Sprinkler
                icon: mdi:sprinkler-variant
              - entity: sensor.sprinkler_on_today_minutes
                name: Sprinkler Today Runtime (min)
                icon: mdi:timer-outline
              - entity: sensor.garden_rain_last_5_days_total
                name: Rain Total Last 5 Days (in)
                icon: mdi:weather-rainy
              - entity: sensor.garden_rain_recent_covers_one_watering
                name: Enough Rain to Skip Watering
                icon: mdi:sprinkler-alert
              - entity: input_number.garden_sprinkler_inches_per_10_minutes
                name: Watering Threshold (in / 10 min)
                icon: mdi:water-percent
          - type: custom:bar-card
            title: Sprinkler Runtime - Last 5 Days
            height: 28px
            positions:
              icon: "off"
              name: inside
              value: inside
            entities:
              - entity: sensor.sprinkler_on_today_5d_minutes
                name: Today
              - entity: sensor.sprinkler_on_yesterday_5d_minutes
                name: Yesterday
              - entity: sensor.sprinkler_on_2_days_ago_5d_minutes
                name: 2 Days Ago
              - entity: sensor.sprinkler_on_3_days_ago_5d_minutes
                name: 3 Days Ago
              - entity: sensor.sprinkler_on_4_days_ago_5d_minutes
                name: 4 Days Ago
          - type: custom:bar-card
            title: Rainfall - Last 5 Days
            height: 28px
            positions:
              icon: "off"
              name: inside
              value: inside
            entities:
              - entity: sensor.openweathermap_rain
                name: Today
              - entity: input_number.garden_rain_yesterday
                name: Yesterday
              - entity: input_number.garden_rain_2_days_ago
                name: 2 Days Ago
              - entity: input_number.garden_rain_3_days_ago
                name: 3 Days Ago
              - entity: input_number.garden_rain_4_days_ago
                name: 4 Days Ago
      - type: vertical-stack
        cards:
          - type: conditional
            conditions:
              - entity: sensor.team_tracker_knicks
                state: IN
            card:
              type: custom:teamtracker-card
              entity: sensor.team_tracker_knicks
              attribute: team_win_probability
          - type: conditional
            conditions:
              - entity: sensor.team_tracker_mets
                state: IN
            card:
              type: custom:teamtracker-card
              entity: sensor.team_tracker_mets
              attribute: team_win_probability
          - type: conditional
            conditions:
              - entity: sensor.team_tracker_nyjets
                state: IN
            card:
              type: custom:teamtracker-card
              entity: sensor.team_tracker_nyjets
              attribute: team_win_probability
          - type: conditional
            conditions:
              - entity: sensor.team_tracker_nyrangers
                state: IN
            card:
              type: custom:teamtracker-card
              entity: sensor.team_tracker_nyrangers
              attribute: team_win_probability
          - type: conditional
            conditions:
              - entity: sensor.team_tracker_nycfc
                state: IN
            card:
              type: custom:teamtracker-card
              entity: sensor.team_tracker_nycfc
              attribute: team_win_probability
      - type: entities
        title: Waste Collection
        state_color: true
        show_header_toggle: false
        entities:
          - entity: sensor.dashboard_garbage_pickup
            name: Trash
            icon: mdi:trash-can
            card_mod:
              style: >-
                :host {\n  --paper-item-icon-color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %}
                !important;\n}\n:host .info,\n:host .text-content,\n:host
                .secondary,\n:host .state {\n  color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %} !important;\n}
          - entity: sensor.dashboard_recycling_pickup
            name: Recycling
            card_mod:
              style: >-
                :host {\n  --paper-item-icon-color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %}
                !important;\n}\n:host .info,\n:host .text-content,\n:host
                .secondary,\n:host .state {\n  color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %} !important;\n}
          - entity: sensor.dashboard_organics_pickup
            name: Organics
            card_mod:
              style: >-
                :host {\n  --paper-item-icon-color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %}
                !important;\n}\n:host .info,\n:host .text-content,\n:host
                .secondary,\n:host .state {\n  color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %} !important;\n}
          - entity: sensor.dashboard_large_items_pickup
            name: Large Items
            card_mod:
              style: >-
                :host {\n  --paper-item-icon-color: {% set s =
                states(config.entity) %}{% if s == 'Today' %}red{% elif s ==
                'Tomorrow' %}yellow{% else %}green{% endif %}
                !important;\n}\n:host .info,\n:host .text-content,\n:host
