alias: Close skylight when AC is turned on
trigger:
  - platform: state
    entity_id: climate.main_bedroom
    attribute: hvac_action
    to: cooling
  - platform: state
    entity_id: climate.main_bedroom
    from: "off"
    to:
      - cool
      - dry
      - heat_cool
condition:
  - condition: template
    value_template: "{{ states('cover.skylight_1') != 'closed' }}"
action:
  - service: cover.close_cover
    target:
      entity_id: cover.skylight_1
  - service: notify.notify
    data:
      message: >
        The skylight was open and the AC started cooling. I've closed the skylight.
mode: single
