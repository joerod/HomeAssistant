alias: "resident_four Room Light Off"
trigger:
  platform: time
  at: '22:00:00'

condition:
  - condition: state
    entity_id: 'person.resident_four'
    state: 'away'

action:
  - service: light.turn_off
    entity_id: light.resident_fours_room
  - service: switch.turn_off
    entity_id: switch.sonoff1