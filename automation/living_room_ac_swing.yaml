id: living_room_ac_enable_swing
alias: Living Room AC Enable Swing When Starting
description: Enables vertical swing whenever the living-room mini split starts running.
mode: restart

trigger:
  - platform: state
    entity_id: climate.living_room
    attribute: hvac_action
    to: cooling
  - platform: state
    entity_id: climate.living_room
    attribute: hvac_action
    to: heating
  - platform: state
    entity_id: climate.living_room
    attribute: hvac_action
    to: drying
  - platform: state
    entity_id: climate.living_room
    from: "off"

condition:
  - condition: template
    value_template: >-
      {{ states('climate.living_room') != 'off'
         and state_attr('climate.living_room', 'swing_mode') != 'Vertical' }}

action:
  - action: climate.set_swing_mode
    target:
      entity_id: climate.living_room
    data:
      swing_mode: Vertical
