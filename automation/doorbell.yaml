alias: Doorbell Ring
mode: restart

trigger:
  - platform: state
    entity_id: event.front_door_chime

variables:
  should_turn_off_vestibule: >-
    {{ is_state('sun.sun', 'below_horizon')
       and is_state('light.vestibule', 'off')
       and is_state('person.resident_one', 'away') }}

  # Calculate seasonal sound once
  seasonal_sound: >-
    {% set halloween = [
      'https://dl.dropboxusercontent.com/s/wyggy6lt680h8o2/Hedwigs%20Theme%20Bell.mp3?dl=0',
      'https://dl.dropboxusercontent.com/s/quwycgq2q3jewwv/cute_horror_song_intro.mp3?dl=0',
      'https://dl.dropboxusercontent.com/scl/fi/krdxv9mwnkj0cf5ovo8p8/Carnival-of-The-Animals.mp3?rlkey=y2jmfymoy8b5nvwrlayp2vqba&st=9sy27gr8'
    ] %}
    {% set thanksgiving =
      'https://dl.dropboxusercontent.com/s/cmxd01f868ylfi5/Thanksgiving%20Theme.mp3?dl=0'
    %}
    {% set christmas = [
      'https://dl.dropboxusercontent.com/s/bz7y7lj0o6bqaip/Christmas%20Bell.mp3?dl=0',
      'https://dl.dropboxusercontent.com/s/byjzg2mryaqwkxv/home_alone.mp3?dl=0'
    ] %}
    {% set default_sound =
      'http://192.0.2.1:8123/local/mp3/knicks_doorbell.mp3'
    %}
    {% set y = now().year %}
    {% set m = now().month %}
    {% set d = now().day %}
    {% set today = now().date() %}
    {% set nov_22 = strptime(y|string ~ '-11-22', '%Y-%m-%d').date() %}
    {% set thanksgiving_day = nov_22 + timedelta(days=((3 - nov_22.weekday()) % 7)) %}
    {% if m == 10 and d > 2 %}
      {{ halloween | random }}
    {% elif m == 11 and today <= thanksgiving_day %}
      {{ thanksgiving }}
    {% elif (m == 12 and d <= 27) or (m == 11 and d >= 27) %}
      {{ christmas | random }}
    {% else %}
      {{ default_sound }}
    {% endif %}

  # Calculate seasonal message once
  seasonal_message: >-
    {% set y = now().year %}
    {% set m = now().month %}
    {% set d = now().day %}
    {% set today = now().date() %}
    {% set nov_22 = strptime(y|string ~ '-11-22', '%Y-%m-%d').date() %}
    {% set thanksgiving_day = nov_22 + timedelta(days=((3 - nov_22.weekday()) % 7)) %}
    {% set messages = {
      'halloween': [
        "Someone is at the front door, or is it a ghost?",
        "Boo! There is movement at the door.",
        "A frightful guest has arrived.",
        "Front door alert. Possibly a vampire."
      ],
      'thanksgiving': [
        "Someone is at the door. Hope they brought pie!",
        "Gobble gobble! A visitor has arrived.",
        "A thankful guest approaches."
      ],
      'christmas': [
        "Someone is at the front door. Maybe Santa.",
        "Ho ho ho! A guest has arrived.",
        "A merry visitor is here."
      ],
      'default': [
        "Someone is at the front door!",
        "A visitor has arrived.",
        "Front door alert!"
      ]
    } %}
    {% if m == 10 and d > 2 %}
      {{ messages.halloween | random }}
    {% elif m == 11 %}
      {% if today <= thanksgiving_day %}
        {{ messages.thanksgiving | random }}
      {% elif d >= 27 %}
        {{ messages.christmas | random }}
      {% else %}
        {{ messages.default | random }}
      {% endif %}
    {% elif m == 12 and d <= 27 %}
      {{ messages.christmas | random }}
    {% else %}
      {{ messages.default | random }}
    {% endif %}

  # Prefer Nest event thumbnail; fall back to latest local snapshot
  doorbell_image: >-
    {% set nest_event_id = trigger.to_state.attributes.nest_event_id | default('', true) %}
    {% set nest_device_id = device_id('camera.front_door') %}
    {% if nest_event_id and nest_device_id %}
      /api/nest/event_media/{{ nest_device_id }}/{{ nest_event_id }}/thumbnail
    {% else %}
      /local/doorbell_latest.jpg?v={{ now().timestamp() | int }}
    {% endif %}
  doorbell_sound_seconds: 6.87
  doorbell_tts_prestart_seconds: -0.6

action:
  # Pause Rosey
  - service: vacuum.pause
    data:
      entity_id: vacuum.rosey

  # Turn on vestibule if dark, off, and you're away
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_turn_off_vestibule }}"
        sequence:
          - service: light.turn_on
            data:
              entity_id: light.vestibule
              brightness_pct: 100

  # Snapshot media player states (including current volume) so we can restore after alert
  - service: scene.create
    continue_on_error: true
    data:
      scene_id: doorbell_media_snapshot
      snapshot_entities:
        - media_player.kitchen
        - media_player.basement
        - media_player.main_bedroom

  # Raise sound system volume for the alert
  - service: media_player.volume_set
    continue_on_error: true
    data:
      entity_id:
        - media_player.kitchen
        - media_player.basement
        - media_player.main_bedroom
      volume_level: 0.7

  # Give Sonos a moment to apply the louder volume before playback starts
  - delay: "00:00:01"

  # Play seasonal sound
  - service: media_player.play_media
    continue_on_error: true
    target:
      entity_id:
        - media_player.kitchen
        - media_player.basement
        - media_player.main_bedroom
    data:
      media_content_type: music
      media_content_id: "{{ seasonal_sound }}"

  # TTS has startup latency, so request it shortly before the chime ends.
  - delay:
      milliseconds: "{{ ((doorbell_sound_seconds - doorbell_tts_prestart_seconds) * 1000) | int }}"

  # Seasonal TTS
  - service: tts.google_say
    continue_on_error: true
    target:
      entity_id:
        - media_player.kitchen
        - media_player.basement
        - media_player.main_bedroom
    data:
      message: "{{ seasonal_message }}"
      cache: true

  # Wait for TTS to finish
  - wait_template: >-
      {{ not is_state('media_player.kitchen', 'playing')
         and not is_state('media_player.basement', 'playing')
         and not is_state('media_player.main_bedroom', 'playing') }}
    timeout: "00:00:15"
    continue_on_timeout: true

  # Snapshot the front door so the notification includes a real image
  - delay: "00:00:02"
  - service: camera.snapshot
    continue_on_error: true
    data:
      entity_id: camera.front_door
      filename: /config/www/doorbell_latest.jpg
  - delay: "00:00:02"

  # Notification (general)
  - service: notify.notify
    continue_on_error: true
    data:
      title: "🔔 Doorbell"
      message: "Someone is at the front door!"
      data:
        clickAction: "/lovelace/cameras"
        tag: doorbell-alert
        importance: high
        ttl: 0
        priority: high

  # iPhone push with the snapshot image
  - service: notify.mobile_app_resident_one_iphone
    continue_on_error: true
    data:
      title: "🔔 Doorbell"
      message: "Someone is at the front door!"
      data:
        push:
          category: camera
        image: "{{ doorbell_image }}"
        url: "/lovelace/cameras"
        clickAction: "/lovelace/cameras"
        tag: doorbell-alert
        importance: high
        ttl: 0
        priority: high

  # Restore media players to their exact pre-doorbell state (including volume)
  - service: scene.turn_on
    continue_on_error: true
    target:
      entity_id: scene.doorbell_media_snapshot

  # Turn vestibule light back off if we turned it on earlier
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ should_turn_off_vestibule }}"
        sequence:
          - delay: "00:10:00"
          - condition: state
            entity_id: light.vestibule
            state: "on"
          - service: light.turn_off
            target:
              entity_id: light.vestibule
